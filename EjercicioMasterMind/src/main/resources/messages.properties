#La conversión de texto a número la hace Spring antes de llamar a método (newGameConfig in MasterMindController), 
#así que un try/catch no puede capturarla. Spring guarda el fallo en el BindingResult como typeMismatch, 
#y en messages.properties sustituya el mensaje técnico por uno comprensible.
typeMismatch.java.lang.Integer=Introduce un número válido

maxIntent.notNull = Indica el número de rondas
maxIntent.Min = Mínimo 5 rondas
maxIntent.Max = Máximo 100 rondas

numLength.notNull = Elige el número de cifras
numLength.Min = Mínimo 3 cifras
numLength.Max = Máximo 10 cifras